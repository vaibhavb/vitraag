- title: "While It Matters"
  subtitle: "a gentle countdown for money and time"
  image: while-it-matters-screenshot.jpg
  description: >
    A small app built after reading *Die With Zero*. It turns the years, weekends, and summers
    you have left into a gentle countdown, and puts three lenses from the book always in view —
    time buckets, memory dividends, and net fulfillment — so "someday" has to compete with an
    actual number.
