- title: "Bhaktamar Walk Practice"
  subtitle: "a walking companion for Sanskrit memorization"
  image: bhaktamar-memory-screenshot.jpg
  description: >
    Built this Paryushan to memorize the opening verses of the Bhaktamar Stotra. It shows one
    line at a time, lets you hide the text and recite it aloud while walking, and advances when
    your browser's speech recognition hears enough of it. Nothing is stored — the point isn't a
    perfect score, it's returning to the line.
  link: https://bhaktambar-memory.vitraag.com/
  link_label: "Open the App"
  blog_link: /2026/09/16/bhaktamar-a-samvatsari-reflection/
  blog_label: "Read the reflection"
  tags:
    - App
    - Jainism
